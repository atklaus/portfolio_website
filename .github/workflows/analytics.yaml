name: analytics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ICEBERG_CATALOG_URI: ${{ secrets.R2_ICEBERG_CATALOG_URI }}
      R2_ICEBERG_WAREHOUSE: ${{ secrets.R2_ICEBERG_WAREHOUSE }}
      R2_ICEBERG_TOKEN: ${{ secrets.R2_ICEBERG_TOKEN }}
      DBT_DUCKDB_PATH: ${{ github.workspace }}/analytics/artifacts/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.0.1
      - name: Install dependencies
        run: |
          poetry install --with analytics --no-interaction --no-ansi
      - name: Run dbt build
        run: |
          cd analytics/dbt
          if [ -f packages.yml ]; then poetry run dbt deps --profiles-dir .; fi
          poetry run dbt run-operation attach_r2_iceberg_if_needed --profiles-dir . --target iceberg
          poetry run dbt run-operation debug_duckdb_databases --profiles-dir . --target iceberg
          poetry run dbt build --profiles-dir . --target iceberg
