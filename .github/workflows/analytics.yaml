name: analytics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_REGION: ${{ secrets.R2_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.0.1
      - name: Install dependencies
        run: |
          poetry install --with analytics --no-interaction --no-ansi
      - name: Prepare dbt profile
        run: |
          cp analytics/dbt/profiles.yml.example analytics/dbt/profiles.yml
      - name: Run dbt
        run: |
          cd analytics/dbt
          if [ -f packages.yml ]; then poetry run dbt deps --profiles-dir .; fi
          poetry run dbt run --profiles-dir .
          poetry run dbt test --profiles-dir .
      - name: Publish marts
        run: |
          poetry run python analytics/pipelines/publish_dbt_marts.py \
            --project databuilds \
            --models mart_example \
            --run-id $GITHUB_SHA
