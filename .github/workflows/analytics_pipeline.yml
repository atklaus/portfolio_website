name: analytics_pipeline

on:
  schedule:
    # 02:30 America/Chicago (UTC-6). Adjust seasonally if you want DST alignment.
    - cron: "30 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_REGION: ${{ secrets.R2_REGION }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BUCKET: ${{ secrets.R2_PUBLIC_BUCKET }}
      R2_ICEBERG_CATALOG_URI: ${{ secrets.R2_ICEBERG_CATALOG_URI }}
      R2_ICEBERG_WAREHOUSE: ${{ secrets.R2_ICEBERG_WAREHOUSE }}
      R2_ICEBERG_TOKEN: ${{ secrets.R2_ICEBERG_TOKEN }}
      DBT_DUCKDB_PATH: ${{ github.workspace }}/analytics/artifacts/warehouse.duckdb
      DRY_RUN: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.0.1
      - name: Install dependencies
        run: |
          poetry install --with analytics --no-interaction --no-ansi
      - name: Install awscli (if missing)
        run: |
          poetry run python -m pip install awscli
      - name: Prepare artifacts directory
        run: |
          mkdir -p analytics/artifacts
          echo "DBT_DUCKDB_PATH=${DBT_DUCKDB_PATH}"
      - name: Build telemetry parquet (optional)
        if: env.DRY_RUN != 'true'
        run: |
          if [ -f analytics/pipelines/build_events_parquet.py ]; then
            poetry run python analytics/pipelines/build_events_parquet.py --days-back 2
          else
            echo "analytics/pipelines/build_events_parquet.py not found; skipping."
          fi
      - name: Load telemetry into Iceberg
        if: env.DRY_RUN != 'true'
        run: |
          poetry run python scripts/load_telemetry_to_iceberg.py
      - name: Build dbt models + docs
        run: |
          cd analytics/dbt
          if [ -f packages.yml ]; then poetry run dbt deps --profiles-dir .; fi
          poetry run dbt build --profiles-dir . --target iceberg
          poetry run dbt docs generate --profiles-dir . --target iceberg --target-path ../artifacts/dbt
      - name: Verify dbt artifacts
        run: |
          set -euo pipefail
          SRC="analytics/artifacts/dbt"
          test -f "${SRC}/index.html"
          test -f "${SRC}/manifest.json"
          test -f "${SRC}/catalog.json"
          echo "DBT_ARTIFACTS_READY=true" >> "$GITHUB_ENV"
      - name: Upload dbt docs to R2 public bucket
        if: env.DRY_RUN != 'true' && env.DBT_ARTIFACTS_READY == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.R2_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          : "${AWS_DEFAULT_REGION:=auto}"

          SRC="analytics/artifacts/dbt"
          BUCKET="s3://${R2_PUBLIC_BUCKET}"
          LATEST_PREFIX="dbt_docs/latest"

          poetry run aws s3 sync "${SRC}" "${BUCKET}/${LATEST_PREFIX}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --cache-control "no-cache" \
            --delete
      - name: Run Great Expectations (non-blocking)
        run: |
          poetry run python scripts/run_gx.py || true
      - name: Upload GX docs to R2 public bucket (if present)
        if: env.DRY_RUN != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.R2_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          : "${AWS_DEFAULT_REGION:=auto}"

          SRC="analytics/artifacts/gx"
          if [ ! -f "${SRC}/index.html" ]; then
            echo "GX docs not generated this run (ok)."
            exit 0
          fi

          BUCKET="s3://${R2_PUBLIC_BUCKET}"
          LATEST_PREFIX="gx/latest"

          poetry run aws s3 sync "${SRC}" "${BUCKET}/${LATEST_PREFIX}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --cache-control "no-cache" \
            --delete
