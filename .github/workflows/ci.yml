name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.0.1
      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi
          poetry run python -m pip install pytest
      - name: Import checks
        run: |
          poetry run python -m compileall app pages projects shared
      - name: Run tests
        run: |
          poetry run pytest projects/bibclean/tests

  deploy:
    # Deploy only on pushes to master, never on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Install flyctl via the official action
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Deploy using the Fly API token stored in repo secrets
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: fly deploy --remote-only
