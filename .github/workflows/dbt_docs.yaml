name: dbt-docs

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: databuilds-public
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_REGION: ${{ secrets.R2_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dbt + awscli
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==1.8.7" "dbt-duckdb==1.8.0"
          pip install awscli
      - name: Generate dbt docs
        run: |
          cd analytics/dbt
          if [ -f packages.yml ]; then dbt deps --profiles-dir .; fi
          dbt docs generate --profiles-dir . --target-path ../artifacts/dbt
      - name: Verify dbt docs output
        run: |
          set -euo pipefail
          SRC="analytics/artifacts/dbt"
          test -f "${SRC}/index.html"
          test -f "${SRC}/manifest.json"
          test -f "${SRC}/catalog.json"
          if [ -f "${SRC}/run_results.json" ]; then
            echo "run_results.json present."
          else
            echo "run_results.json not present (ok)."
          fi
      - name: Upload dbt docs to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.R2_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          : "${AWS_DEFAULT_REGION:=auto}"

          R2_ENDPOINT="${R2_ENDPOINT}"
          BUCKET="s3://${R2_BUCKET}"
          SRC="analytics/artifacts/dbt"
          SHA_PREFIX="dbt_docs/${GITHUB_SHA}"
          LATEST_PREFIX="dbt_docs/latest"

          aws s3 sync "${SRC}" "${BUCKET}/${SHA_PREFIX}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --cache-control "no-cache"
          aws s3 sync "${SRC}" "${BUCKET}/${LATEST_PREFIX}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --cache-control "no-cache" \
            --delete
