name: dbt-docs

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: databuilds-public
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_REGION: ${{ secrets.R2_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.0.1
      - name: Install dependencies
        run: |
          poetry install --with analytics --no-interaction --no-ansi
      - name: Generate dbt docs
        run: |
          cd analytics/dbt
          if [ -f packages.yml ]; then poetry run dbt deps --profiles-dir .; fi
          poetry run dbt docs generate --profiles-dir . --target-path ../artifacts/dbt
      - name: Ensure dbt docs favicon
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          ico_b64 = (
              "AAABAAEAAQEAAAEAIABEAAAAFgAAAIlQTkcNChoKAAAADUlIRFIAAAABAAAAAQgE"
              "AAAAtRwMAgAAAAtJREFUeNpj/P8fAAMDAgDu/l8kAAAAAElFTkSuQmCC"
          )
          target = Path("analytics/artifacts/dbt/assets/favicons/favicon.ico")
          if target.exists():
              print(f"favicon already exists at {target}")
          else:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(ico_b64))
              print(f"Wrote minimal favicon to {target}")
          PY
      - name: Verify dbt docs output
        run: |
          set -euo pipefail
          SRC="analytics/artifacts/dbt"
          test -f "${SRC}/index.html"
          test -f "${SRC}/manifest.json"
          test -f "${SRC}/catalog.json"
          if [ -f "${SRC}/run_results.json" ]; then
            echo "run_results.json present."
          else
            echo "run_results.json not present (ok)."
          fi
      - name: Install AWS CLI
        run: |
          python -m pip install --upgrade awscli
      - name: Upload dbt docs to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.R2_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          : "${AWS_DEFAULT_REGION:=auto}"

          R2_ENDPOINT="${R2_ENDPOINT}"
          BUCKET="s3://${R2_BUCKET}"
          SRC="analytics/artifacts/dbt"
          SHA_PREFIX="dbt_docs/${GITHUB_SHA}"
          LATEST_PREFIX="dbt_docs/latest"

          aws s3 sync "${SRC}" "${BUCKET}/${SHA_PREFIX}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --cache-control "no-cache"
          aws s3 sync "${SRC}" "${BUCKET}/${LATEST_PREFIX}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --cache-control "no-cache" \
            --delete
