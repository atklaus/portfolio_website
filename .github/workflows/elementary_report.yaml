name: elementary-report

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: databuilds-public
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_REGION: ${{ secrets.R2_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dbt + Elementary + awscli
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==1.8.7" "dbt-duckdb==1.8.0" "elementary-data" awscli
      - name: Build dbt artifacts
        run: |
          cd analytics/dbt
          dbt deps --profiles-dir .
          dbt build --profiles-dir .
      - name: Run Elementary models
        continue-on-error: true
        run: |
          cd analytics/dbt
          dbt run -s elementary --profiles-dir . --full-refresh
      - name: Generate Elementary report
        continue-on-error: true
        run: |
          cd analytics/dbt
          edr report --project-dir . --profiles-dir . --output-path ../artifacts/elementary
      - name: Upload Elementary report to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.R2_REGION }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          : "${AWS_DEFAULT_REGION:=auto}"

          SRC="analytics/artifacts/elementary"
          if [ ! -f "${SRC}/index.html" ]; then
            echo "Elementary report not found at ${SRC}/index.html. Skipping upload."
            exit 0
          fi

          R2_ENDPOINT="${R2_ENDPOINT}"
          BUCKET="s3://${R2_BUCKET}"
          SHA_PREFIX="elementary/${GITHUB_SHA}"
          LATEST_PREFIX="elementary/latest"

          aws s3 sync "${SRC}" "${BUCKET}/${SHA_PREFIX}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --cache-control "no-cache"
          aws s3 sync "${SRC}" "${BUCKET}/${LATEST_PREFIX}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --cache-control "no-cache" \
            --delete
