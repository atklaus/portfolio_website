name: "portfolio_analytics"
version: "1.0.0"
config-version: 2

profile: "portfolio_analytics"

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "../artifacts/dbt"
  - "dbt_packages"

models:
  portfolio_analytics:
    +materialized: table
    staging:
      +materialized: table
    marts:
      +materialized: table

on-run-start:
  - "{{ log('on-run-start fired, target=' ~ target.name, info=True) }}"
  - "{{ attach_r2_iceberg_if_needed() }}"
