# fly.toml - Streamlit portfolio app configuration

app = "streamlit-portfolio"

# Primary process group for the app
[processes]
  app = "sh -c 'streamlit run app.py --server.address=${STREAMLIT_SERVER_ADDRESS:-0.0.0.0} --server.port=${PORT:-8501}'"

# HTTP service exposing Streamlit on port 8501
[http_service]
  internal_port = 8501
  force_https = true
  processes = ["app"]
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  # Basic request concurrency limits
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  # Health check for the HTTP service
  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "45s"
    method = "GET"
    path = "/"
    protocol = "http"

# Optional runtime environment (secrets should be set via `fly secrets set`)
[env]
  PORT = "8501"
  STREAMLIT_SERVER_ADDRESS = "0.0.0.0"
  STREAMLIT_SERVER_PORT = "8501"
  STREAMLIT_SERVER_HEADLESS = "true"
  STREAMLIT_SERVER_ENABLE_CORS = "false"

# Deployment strategy for safe rollouts
[deploy]
  strategy = "rolling"
