    <style>
      :root {
        color-scheme: light;
        --bg: #0b1614;
        --panel: #132420;
        --text: #f2f8f7;
        --muted: #b7cbc7;
        --accent: #8ce7d5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Manrope", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 15%, rgba(140, 231, 213, 0.18), transparent 40%),
          radial-gradient(circle at 90% 85%, rgba(40, 87, 78, 0.3), transparent 40%),
          var(--bg);
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      main {
        width: min(900px, 100%);
        border: 1px solid rgba(140, 231, 213, 0.25);
        border-radius: 20px;
        padding: 2rem;
        background: linear-gradient(165deg, rgba(19, 36, 32, 0.95), rgba(11, 22, 20, 0.95));
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 0.5rem 0;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.55;
      }
      .actions {
        margin-top: 1.5rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .btn {
        text-decoration: none;
        border-radius: 999px;
        padding: 0.65rem 1rem;
        font-weight: 700;
        border: 1px solid rgba(140, 231, 213, 0.3);
      }
      .btn-primary {
        background: var(--accent);
        color: #0b1614;
        border-color: transparent;
      }
      .btn-secondary {
        color: var(--text);
      }
    </style>

        <a class="btn btn-secondary" href="https://github.com/atklaus" target="_blank" rel="noopener">GitHub</a>
        <a class="btn btn-secondary" href="https://linkedin.com/in/atklaus" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </main>
